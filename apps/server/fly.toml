# Fly.io config for the RollBiz Colyseus server.
#
# Deploy from the MONOREPO ROOT (the Docker build context must be the root):
#
#   fly deploy . --config apps/server/fly.toml --dockerfile apps/server/Dockerfile \
#     --ignorefile apps/server/.dockerignore --ha=false
#
# Secrets (once):
#   fly secrets set --config apps/server/fly.toml \
#     SUPABASE_URL=https://<project>.supabase.co \
#     ALLOWED_ORIGINS=https://<your-app>.vercel.app
#
# SINGLE MACHINE, SINGLE REGION: rooms live in process memory and there is no
# Redis presence/driver, so all players of a room must hit the same machine.
# Run exactly one machine (`--ha=false`, or `fly scale count 1`). Scaling out
# later needs @colyseus/redis-presence + redis-driver and per-machine routing.
#
# Deploys restart the machine and drop in-progress games.

app = "rollbiz-server"
primary_region = "sin" # pick the region closest to your players

# Colyseus shuts down gracefully on SIGTERM (disposes rooms, closes sockets).
kill_signal = "SIGTERM"
kill_timeout = 30

[env]
  NODE_ENV = "production"
  PORT = "2567"

[http_service]
  internal_port = 2567
  force_https = true
  # Never stop/suspend: live rooms are in memory and WebSocket sessions are
  # long-lived. Stopping the machine would end every game.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    # Each player holds one long-lived WebSocket connection.
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
